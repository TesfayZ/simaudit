name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev,mujoco]'
      - run: python -m pytest -q
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: |
          cd /tmp
          PYTHONPATH=$GITHUB_WORKSPACE/examples simaudit order --factory custom_simulator:factory --probes $GITHUB_WORKSPACE/examples/probes.json --strict
          python -c "import sys, simaudit; assert 'gymnasium' not in sys.modules and 'mujoco' not in sys.modules"
