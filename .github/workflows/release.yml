name: release
on:
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Check tag matches package version
        run: |
          python - <<'EOF'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert tag == ver, f"tag {tag} != pyproject version {ver}"
          EOF
      - run: python validation/verify_receipt.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Exercise the wheel that will be published
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          simaudit diagnose full --inputs simaudit.demo:inputs --strict
          python -c "from importlib.metadata import version; import os, simaudit; assert version('simaudit') == simaudit.__version__ == os.environ['GITHUB_REF_NAME'][1:]"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
