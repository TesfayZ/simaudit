[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simaudit"
version = "0.2.0a1"
description = "Scoped, reproducible diagnostics for user-supplied simulators"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
  "reinforcement-learning", "simulator", "verification", "mujoco", "gymnasium", "testing",
  "simulator-validation", "numerical-order", "model-diagnostics", "scientific-computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Framework :: Pytest",
]
license-files = ["LICENSE"]
authors = [{name = "Tesfay Zemuy Gebrekidan"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
algebra = ["sympy>=1.12"]
gymnasium = ["gymnasium>=1.0"]
mujoco = ["mujoco>=3.2", "gymnasium[mujoco]>=1.0"]
pytest = ["pytest>=8"]
dev = ["pytest>=8", "build>=1", "twine>=5", "gymnasium>=1.0"]

[project.urls]
Homepage = "https://github.com/TesfayZ/simaudit"
Repository = "https://github.com/TesfayZ/simaudit"
Issues = "https://github.com/TesfayZ/simaudit/issues"
Documentation = "https://github.com/TesfayZ/simaudit#readme"
Changelog = "https://github.com/TesfayZ/simaudit/blob/main/CHANGELOG.md"

[project.scripts]
simaudit = "simaudit.cli:main"

[project.entry-points.pytest11]
simaudit = "simaudit.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.data-files]
"share/simaudit" = ["CITATION.cff", "references.bib", "THIRD_PARTY.md"]
"share/simaudit/docs" = ["docs/ADAPTERS.md", "docs/DIAGNOSTIC_WORKFLOW.md", "docs/REPORTS.md"]
"share/simaudit/evidence" = ["evidence/workflow_cases.json", "evidence/native_controls.json"]
